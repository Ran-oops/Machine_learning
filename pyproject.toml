[project]
name = "machine-learning"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ran" }
]
requires-python = ">=3.12"
dependencies = [
    "d2l>=0.17.0",
    "ipython==7.23.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.3",
    "pandas>=3.0.1",
    "torch>=2.7.1",
    "torchaudio>=2.7.1",
    "torchvision>=0.22.1",
]

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.2.0",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "sjtu-cu118"
url = "https://mirror.sjtu.edu.cn/pytorch-wheels/cu118"
explicit = true

[[tool.uv.index]]
name = "aliyun-cu118"
url = "https://mirrors.aliyun.com/pytorch-wheels/cu118"
explicit = true

[tool.uv.sources]
torch = { index = "sjtu-cu118" }
torchvision = { index = "sjtu-cu118" }
torchaudio = { index = "sjtu-cu118" }
